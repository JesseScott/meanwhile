name: CI

# Runs on every pull request into main, and on main itself, so a broken merge shows up straight away.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests and a debug build
        run: |
          chmod +x ./gradlew
          ./gradlew :core:test :app:testDebugUnitTest :app:assembleDebug --console=plain

  version:
    name: Version check
    # Only matters when a pull request changes version.properties, i.e. it is a release.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: versionCode goes up, versionName looks like a version
        run: |
          base="origin/${{ github.base_ref }}"
          if git diff --quiet "$base"...HEAD -- version.properties; then
            echo "version.properties is unchanged: not a release PR, nothing to check."
            exit 0
          fi
          read_prop() { grep -E "^$2=" | head -n1 | cut -d= -f2- | tr -d '[:space:]'; }
          old_code=$(git show "$base:version.properties" | read_prop - versionCode)
          new_code=$(read_prop - versionCode < version.properties)
          new_name=$(read_prop - versionName < version.properties)
          echo "versionCode: $old_code -> $new_code, versionName: $new_name"
          if ! [[ "$new_code" =~ ^[0-9]+$ ]]; then echo "::error file=version.properties::versionCode must be a whole number"; exit 1; fi
          if ! [[ "$new_name" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "::error file=version.properties::versionName must look like 1.2.3"; exit 1; fi
          if [ "$new_code" -le "$old_code" ]; then
            echo "::error file=version.properties::versionCode must be higher than on main ($old_code). Google Play rejects a repeat."
            exit 1
          fi
