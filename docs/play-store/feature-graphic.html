<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
<style>
  html, body { margin: 0; width: 1024px; height: 500px; overflow: hidden; }

  .bar { width: 96px; height: 6px; border-radius: 3px; background: #ffb703; margin: 28px 0 24px; }
  p { margin: 0; font-size: 33px; line-height: 1.32; font-weight: 400; color: #c9d1ff; }
  svg { position: absolute; right: 56px; top: 70px; width: 360px; height: 360px; }
</style></head>
<body>
  <div class="text"><h1>Meanwhile</h1><div class="bar"></div><p>News from the other side<br>of the world</p></div>
  <svg viewBox="22 22 64 64" aria-hidden="true">
    <circle cx="54" cy="54" r="26" fill="none" stroke="#EAF0FF" stroke-width="2.4"/>

    <ellipse cx="54" cy="54" rx="26" ry="10" fill="none" stroke="#EAF0FF" stroke-opacity="0.28" stroke-width="1.4"/>

    <circle cx="72.4" cy="72.4" r="4.6" fill="#FFB703"/>
  </svg>
</body></html>
